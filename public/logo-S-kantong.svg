<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220">
  <style>
    .logo-path {
      stroke: #1a1a1a;
    }

    @media (prefers-color-scheme: dark) {
      .logo-path {
        stroke: #ffffff;
      }
    }
  </style>
  <g class="logo-path" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- outline kantong -->
    <path d="M30,30 L190,30 L190,135 Q190,148 178,156 L110,200 L42,156 Q30,148 30,135 Z" stroke-width="10"/>
    <!-- lipatan atas -->
    <path d="M30,56 L190,56" stroke-width="10"/>
    <!-- jahitan putus-putus -->
    <path d="M46,72 L46,134 Q46,142 53,147 L110,184 L167,147 Q174,142 174,134 L174,72" stroke-width="4" stroke-dasharray="2 9"/>
    <!-- S -->
    <g transform="translate(110,118) scale(0.5) translate(-100,-98)">
      <path d="M150,50 C110,20 60,30 60,65 C60,100 140,100 140,135 C140,170 90,180 50,150" stroke-width="20"/>
    </g>
  </g>
</svg>
